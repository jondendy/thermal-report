# nginx/nginx.conf
# Nginx reverse proxy for thermal-report
# Sits in front of gunicorn, handles rate limiting and large file uploads.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 10 requests/second per IP — enough for normal use, blocks scanner floods
    limit_req_zone  $binary_remote_addr  zone=app:10m  rate=10r/s;
    # Stricter zone for upload endpoint (large file POSTs)
    limit_req_zone  $binary_remote_addr  zone=upload:10m  rate=2r/s;

    # ── General settings ──────────────────────────────────────────────────────
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size  200M;   # allow large FLIR image batch uploads

    # ── Hide server version ───────────────────────────────────────────────────
    server_tokens  off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # ── Block obvious scanner probes ─────────────────────────────────────────
    # Requests for /login, /admin, /wp-login etc. get an immediate 404
    # without ever touching the Flask app.
    map $request_uri $is_scanner {
        default          0;
        ~*/login         1;
        ~*/wp-login      1;
        ~*/admin         1;
        ~*/.env          1;
        ~*/phpmyadmin    1;
        ~*/xmlrpc        1;
    }

    server {
        listen  80;
        server_name  _;

        # Drop scanner probes fast
        if ($is_scanner) {
            return 404;
        }

        # ── Upload endpoint — stricter rate limit ─────────────────────────────
        location /upload {
            limit_req  zone=upload  burst=5  nodelay;
            proxy_pass         http://app:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;   # large uploads need time
        }

        # ── All other routes ──────────────────────────────────────────────────
        location / {
            limit_req  zone=app  burst=20  nodelay;
            proxy_pass         http://app:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Block raw TLS/binary probes before they log as errors ─────────────
        error_page 400 /400.html;
        location = /400.html { return 400; }
    }
}
