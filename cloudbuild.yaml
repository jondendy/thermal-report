# cloudbuild.yaml
# GCP Cloud Build pipeline: build → push → deploy to Cloud Run
#
# One-time GCP Console setup:
#   1. Artifact Registry: create repo
#      gcloud artifacts repositories create thermal-report \
#        --repository-format=docker \
#        --location=us-central1 \
#        --project=sc-thermal-project
#
#   2. Connect your GitHub repo in Cloud Build > Triggers > Connect Repository
#      Set trigger: push to main branch, use this file.
#
#   3. Grant Cloud Build SA permissions (run once):
#      PROJECT_NUMBER=$(gcloud projects describe sc-thermal-project --format='value(projectNumber)')
#      CB_SA="${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com"
#      gcloud projects add-iam-policy-binding sc-thermal-project \
#        --member="serviceAccount:${CB_SA}" --role="roles/run.admin"
#      gcloud projects add-iam-policy-binding sc-thermal-project \
#        --member="serviceAccount:${CB_SA}" --role="roles/iam.serviceAccountUser"
#      gcloud projects add-iam-policy-binding sc-thermal-project \
#        --member="serviceAccount:${CB_SA}" --role="roles/artifactregistry.writer"
#      gcloud projects add-iam-policy-binding sc-thermal-project \
#        --member="serviceAccount:${CB_SA}" --role="roles/secretmanager.secretAccessor"
#
#   4. Store your .env secrets in Secret Manager (run once per secret):
#      gcloud secrets create GOOGLE_DRIVE_CREDENTIALS \
#        --data-file=service_account.json \
#        --project=sc-thermal-project
#      (repeat for any other secrets from your .env)
#
# After setup, every push to main auto-builds and deploys.

substitutions:
  _REGION: us-central1
  _PROJECT: sc-thermal-project
  _SERVICE: thermal-report
  _REGISTRY: us-central1-docker.pkg.dev
  _IMAGE: us-central1-docker.pkg.dev/sc-thermal-project/thermal-report/app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # faster builds, still cheap

steps:

  # ── 1. Build the image ─────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=$_IMAGE:$SHORT_SHA
      - --tag=$_IMAGE:latest
      - --cache-from=$_IMAGE:latest   # layer cache from previous build
      - .

  # ── 2. Push both tags to Artifact Registry ─────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_IMAGE
    waitFor: [build]

  # ── 3. Deploy to Cloud Run ────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --allow-unauthenticated          # team can reach it without Google login
      - --port=8000                      # matches gunicorn bind in Dockerfile
      - --memory=1Gi                     # weasyprint needs headroom for PDF gen
      - --cpu=1
      - --min-instances=0               # scale to zero when idle = no cost
      - --max-instances=5
      - --timeout=300                    # allow time for PDF generation
      - --concurrency=10
      - --service-account=thermal-app-sa@sc-thermal-project.iam.gserviceaccount.com
      # ── Secrets from Secret Manager (add one --set-secrets line per secret)
      # Format: ENV_VAR_NAME=SECRET_NAME:latest
      # Uncomment and extend once you've created secrets in Secret Manager:
      - --set-secrets=GOOGLE_DRIVE_CREDENTIALS=GOOGLE_DRIVE_CREDENTIALS:latest
      - --set-secrets=FLASK_SECRET_KEY=FLASK_SECRET_KEY:latest
      # ── Cloud Storage bucket for persistent uploads/reports
      # Uncomment once you've created the bucket and enabled GCS FUSE:
      # - --add-volume=name=gcs-data,type=cloud-storage,bucket=sc-thermal-data
      # - --add-volume-mount=volume=gcs-data,mount-path=/app/upload
    waitFor: [push]

images:
  - $_IMAGE:$SHORT_SHA
  - $_IMAGE:latest
