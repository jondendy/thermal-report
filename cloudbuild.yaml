# cloudbuild.yaml
# GCP Cloud Build pipeline: build → push → deploy to Cloud Run

substitutions:
  _REGION: us-central1
  _PROJECT: sc-thermal-project
  _SERVICE: thermal-report
  _IMAGE: us-central1-docker.pkg.dev/sc-thermal-project/thermal-report/app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:

  # ── 1. Build ────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=$_IMAGE:$SHORT_SHA
      - --tag=$_IMAGE:latest
      - --cache-from=$_IMAGE:latest
      - .

  # ── 2. Push ─────────────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_IMAGE
    waitFor: [build]

  # ── 3. Deploy ───────────────────────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:$SHORT_SHA
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --allow-unauthenticated
      - --port=8000
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --timeout=300
      - --concurrency=10
      - --service-account=thermal-app-sa@sc-thermal-project.iam.gserviceaccount.com
      - --set-secrets=GOOGLE_DRIVE_CREDENTIALS=GOOGLE_DRIVE_CREDENTIALS:latest
      - --set-secrets=FLASK_SECRET_KEY=FLASK_SECRET_KEY:latest
      - --set-secrets=GOOGLE_DRIVE_ROOT_FOLDER_ID=GOOGLE_DRIVE_ROOT_FOLDER_ID:latest
      - --add-volume=name=gcs-images,type=cloud-storage,bucket=sc-thermal-data
      - --add-volume-mount=volume=gcs-images,mount-path=/app/.Images
      - --add-volume=name=gcs-reports,type=cloud-storage,bucket=sc-thermal-data
      - --add-volume-mount=volume=gcs-reports,mount-path=/app/.reports
    waitFor: [push]

images:
  - $_IMAGE:$SHORT_SHA
  - $_IMAGE:latest
