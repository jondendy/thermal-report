<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Heat Loss Survey Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f4f4;
        }
        .report-container {
            background: white;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            border-bottom: 4px solid #2c3e50;
            padding-bottom: 20px;
            margin-bottom: 30px;
            position: relative;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 2.5em;
        }
        .header .subtitle {
            color: #7f8c8d;
            font-size: 1.2em;
            margin-top: 10px;
        }
        .download-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #218838;
            color: white;
        }
        .property-info {
            background: #ecf0f1;
            padding: 20px;
            border-left: 4px solid #3498db;
            margin-bottom: 30px;
        }
        .property-info h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .summary-box {
            background: #e8f4f8;
            border: 2px solid #3498db;
            padding: 20px;
            margin: 30px 0;
            border-radius: 5px;
        }
        .summary-box h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .severity-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin: 5px;
        }
        .severity-critical { background: #e74c3c; color: white; }
        .severity-high { background: #e67e22; color: white; }
        .severity-medium { background: #f39c12; color: white; }
        .severity-low { background: #f1c40f; color: #333; }
        .finding {
            margin: 40px 0;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }
        .finding h3 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.5em;
        }
        .finding-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .finding-image {
            border: 2px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .finding-image img {
            width: 100%;
            height: auto;
            display: block;
        }
        .finding-image .caption {
            background: #2c3e50;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 0.9em;
        }
        .temperature-stats {
            background: #fff;
            padding: 15px;
            margin: 15px 0;
            border-left: 4px solid #3498db;
        }
        .recommendations {
            background: #d4edda;
            border: 2px solid #28a745;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .recommendations h4 {
            color: #155724;
            margin-top: 0;
        }
        .recommendations ul { margin: 10px 0; }
        .recommendations li { margin: 8px 0; }
        .savings-estimate {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .priority-high { color: #c0392b; font-weight: bold; }
        .priority-medium { color: #e67e22; font-weight: bold; }
        .priority-low { color: #7f8c8d; }
        .recommendations-section {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            padding: 30px;
            margin: 50px 0;
            border-radius: 5px;
            text-align: center;
        }
        .recommendations-section h2 { color: #1565c0; margin-top: 0; }
        .recommendations-section p { color: #424242; font-size: 1.1em; margin: 15px 0; }
        .recommendations-button {
            display: inline-block;
            background: #2196f3;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
            cursor: pointer;
        }
        .recommendations-button:hover { background: #1976d2; }
        .links-section {
            background: #f0f7ff;
            border: 2px solid #b3d4fc;
            padding: 25px;
            margin: 40px 0;
            border-radius: 5px;
        }
        .links-section h2 { color: #1565c0; margin-top: 0; }
        .links-section a { color: #1565c0; }
        .attached-notes {
            margin: 50px 0;
        }
        .attached-notes h2 {
            color: #2c3e50;
            border-bottom: 4px solid #2c3e50;
            padding-bottom: 10px;
        }
        .note-page {
            margin: 30px 0;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fafafa;
        }
        .note-page h3 {
            color: #2c3e50;
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 2px solid #ecf0f1;
            text-align: center;
            color: #7f8c8d;
        }
        @media print {
            body { background: white; }
            .report-container { box-shadow: none; }
            .download-btn { display: none !important; }
            .recommendations-button {
                border: 2px solid #2196f3;
                background: white;
                color: #2196f3;
            }
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="header">
            <h1>Building Heat Loss Survey Report</h1>
            <div class="subtitle">Thermal Imaging Analysis and Energy Assessment</div>
            <a href="/download_pdf/{{ batch_id }}" class="download-btn">
